{% extends 'base.html' %}
{% block heading %}Message Sent{% endblock %}
{% block content %}
<section class="card sent-panel"><span class="eyebrow">SMTP DELIVERY</span><h2>Message sent</h2><p>The selected message was delivered to the configured authorized recipient.</p><div class="detail-grid"><div><span>Recipient</span><strong>{{ recipient }}</strong></div><div><span>Scenario</span><strong>{{ scenario.name }}</strong></div></div><a class="btn primary" href="{{ url_for('simulation') }}">Back to Simulations</a></section>
{% endblock %}
